name: Update lotto results
on:
  schedule:
    - cron: '30 8 * * *'
    - cron: '30 11 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/update_results.py --days 3
      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet || (git commit -m "Update lotto results" && git push)
